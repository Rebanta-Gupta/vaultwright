[project]
name = "vaultwright"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rebanta Gupta", email = "guptarebanta816@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12",
    "ollama>=0.6.2",
    "python-frontmatter>=1.3.0",
]

[project.scripts]
vaultwright = "vaultwright.cli:app"
vw = "vaultwright.cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.8",
]
