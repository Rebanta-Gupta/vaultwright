[project]
name = "vaultwright"
version = "0.1.0"
description = "Command line tools for working with an Obsidian vault, including local-LLM note refining."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["obsidian", "markdown", "notes", "ollama", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
authors = [
    { name = "Rebanta Gupta", email = "guptarebanta816@gmail.com" }
]
requires-python = ">=3.11"   # tomllib is the floor
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "ollama>=0.6.2",
    "pydantic>=2.0",
    "python-frontmatter>=1.3.0",
]

[project.urls]
Repository = "https://github.com/Rebanta-Gupta/vaultwright"
Issues = "https://github.com/Rebanta-Gupta/vaultwright/issues"

[project.scripts]
vaultwright = "vaultwright.cli:app"
vw = "vaultwright.cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.8",
]
