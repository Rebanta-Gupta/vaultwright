name: publish

# Publishes to PyPI when a GitHub Release is created.
# No token anywhere: PyPI trusts this repo + workflow via OIDC.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # 0.1.0 shipped while CI was red — publishing must not outrun the tests.
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # must match the environment name set on PyPI
    permissions:
      id-token: write          # required for trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
